name: API Build Artifacts

on:
  push:
    branches: [v3]
    tags: ["v*"]
  pull_request:
    branches: [v3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck API
        run: bun run --cwd apps/api typecheck

      - name: Build for Bun runtime
        run: |
          rm -rf apps/api/out apps/api/out-bun apps/api/out-node artifacts
          bun run --cwd apps/api build
          mv apps/api/out apps/api/out-bun

      - name: Build for Node runtime
        run: |
          bun run --cwd apps/api build:node
          mv apps/api/out apps/api/out-node

      - name: Pack build outputs
        run: |
          mkdir -p artifacts
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          tar -C apps/api/out-bun -czf "artifacts/apps-api-bun-${SHORT_SHA}.tar.gz" .
          tar -C apps/api/out-node -czf "artifacts/apps-api-node-${SHORT_SHA}.tar.gz" .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apps-api-build-${{ github.sha }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Publish release assets on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
